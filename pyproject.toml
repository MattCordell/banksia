[project]
name = "banksia"
version = "0.1.0"
description = "Synthetic patient data generator"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
imaging = [
    "Pillow>=10.0",
]

[project.scripts]
banksia = "generate:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "conditions*", "laboratory*", "population*", "formatters*", "identity*", "image_generation*"]

[tool.setuptools.package-data]
conditions = ["*.json"]
laboratory = ["*.json"]
population = ["data/*.xlsx"]
image_generation = ["*.json"]

[tool.ruff]
line-length = 100
